<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic Maze</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>Dynamic Maze</h1>
            <div class="stats">
                <div class="timer">Time: <span id="time">15</span>s</div>
                <div class="level">Level: <span id="level">1</span></div>
                <div class="score">Score: <span id="score">0</span></div>
                <button id="sound-toggle" class="sound-on" title="Toggle Sound">🔊</button>
            </div>
        </div>
        
        <div id="game-board"></div>
        
        <div class="controls">
            <div class="instructions">
                <p>Use arrow keys or WASD to move. Reach the exit before time runs out!</p>
                <p>Beware of the pursuing AI and the shifting maze walls.</p>
            </div>
        </div>
    </div>
    
    <div id="start-overlay" class="start-overlay">
        <button id="start-button">Start Game</button>
    </div>
    
    <div id="game-over" class="modal">
        <div class="modal-content">
            <h2>Game Over</h2>
            <p id="game-over-message">You were trapped in the shifting maze.</p>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-button">Try Again</button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="joystick-area">
            <div id="joystick-base">
                <div id="joystick-thumb"></div>
            </div>
        </div>
    </div>

    <!-- Audio elements for sound effects -->
    <audio id="move-sound" src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" preload="auto"></audio>
    <audio id="shift-sound" src="https://assets.mixkit.co/active_storage/sfx/146/146-preview.mp3" preload="auto"></audio>
    <audio id="level-complete-sound" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3" preload="auto"></audio>
    <audio id="game-over-sound" src="https://assets.mixkit.co/active_storage/sfx/566/566-preview.mp3" preload="auto"></audio>
    <audio id="exit-reached-sound" src="https://assets.mixkit.co/active_storage/sfx/212/212-preview.mp3" preload="auto"></audio>

    <script src="./script.js"></script>
</body>
</html>
